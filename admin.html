<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Notestreamsfx</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0;padding:24px}
    .box{max-width:1100px;margin:auto;background:#1b1b1b;padding:20px;border-radius:16px}
    input,button,textarea{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid #444;background:#222;color:#fff}
    button{cursor:pointer;background:#ff4d6d;border:none;font-weight:bold}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .card{background:#222;padding:14px;border-radius:12px;margin:12px 0}
    .meta{color:#bbb;font-size:14px}
    .comment{background:#2a2a2a;padding:10px;border-radius:10px;margin-top:8px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .actions button{width:auto;padding:8px 10px}
    .danger{background:#d9534f}
    .ok{background:#28a745}
    .muted{opacity:.6}
  </style>
</head>
<body>
  <div class="box">
    <h1>Admin Notestreamsfx</h1>
    <p class="meta" id="status">Chargement...</p>

    <div class="row">
      <div>
        <h2>Connexion admin</h2>
        <input id="email" type="email" placeholder="Email admin" />
        <input id="password" type="password" placeholder="Mot de passe" />
        <button id="loginBtn">Se connecter</button>
        <button id="logoutBtn">Se déconnecter</button>
      </div>

      <div>
        <h2>Ajouter un commentaire</h2>
        <input id="gameId" type="number" placeholder="Game ID" />
        <input id="author" type="text" placeholder="Pseudo" />
        <textarea id="text" rows="5" placeholder="Commentaire..."></textarea>
        <button id="addCommentBtn">Ajouter commentaire</button>
      </div>
    </div>

    <h2>Jeux</h2>
    <button id="refreshBtn">Rafraîchir</button>
    <div id="games"></div>

    <h2>Commentaires</h2>
    <div id="comments"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://dpzorxmdblysdbebqkdw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_nozWqfhiNgwyXnYLMngXHQ_KUvRgtZ6";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    let gamesData = [];
    let commentsData = [];

    const statusEl = document.getElementById('status');
    const gamesEl = document.getElementById('games');
    const commentsEl = document.getElementById('comments');

    function setStatus(msg, ok=false) {
      statusEl.textContent = msg;
      statusEl.style.color = ok ? '#7CFF9B' : '#ffb3b3';
    }

    async function checkSession() {
      const { data, error } = await supabase.auth.getSession();
      if (error) return setStatus('Erreur session: ' + error.message);
      setStatus(data.session ? 'Connecté' : 'Déconnecté');
    }

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) return setStatus('Connexion refusée: ' + error.message);
      setStatus('Connexion réussie', true);
      await loadAll();
    }

    async function logout() {
      const { error } = await supabase.auth.signOut();
      if (error) return setStatus('Déconnexion impossible: ' + error.message);
      setStatus('Déconnecté');
    }

    async function loadAll() {
      setStatus('Chargement des données...');
      const [gamesRes, commentsRes] = await Promise.all([
        supabase.from('games').select('*').order('created_at', { ascending: false }),
        supabase.from('comments').select('*').order('created_at', { ascending: false })
      ]);

      if (gamesRes.error) return setStatus('Erreur games: ' + gamesRes.error.message);
      if (commentsRes.error) return setStatus('Erreur comments: ' + commentsRes.error.message);

      gamesData = gamesRes.data || [];
      commentsData = commentsRes.data || [];
      render();
      setStatus('Données chargées', true);
    }

    function render() {
      gamesEl.innerHTML = gamesData.map(g => `
        <div class="card">
          <strong>${g.name || 'Sans nom'}</strong>
          <div class="meta">ID: ${g.id} | slug: ${g.slug || '-'}</div>
          <div class="meta">${g.genre || ''}</div>
        </div>
      `).join('');

      commentsEl.innerHTML = commentsData.map(c => `
        <div class="card ${c.hidden ? 'muted' : ''}">
          <div><strong>#${c.id}</strong> — ${c.author || 'Anonyme'}</div>
          <div class="meta">Game ID: ${c.game_id} | ${c.hidden ? 'Masqué' : 'Visible'} ${c.pinned ? '| Mis en avant' : ''}</div>
          <div class="comment">${c.text || ''}</div>
          <div class="actions">
            <button class="ok" onclick="toggleHide(${c.id}, ${c.hidden ? 'true' : 'false'})">${c.hidden ? 'Réafficher' : 'Masquer'}</button>
            <button onclick="togglePin(${c.id}, ${c.pinned ? 'true' : 'false'})">${c.pinned ? 'Retirer pin' : 'Mettre en avant'}</button>
            <button class="danger" onclick="deleteComment(${c.id})">Supprimer</button>
          </div>
        </div>
      `).join('');
    }

    async function addComment() {
      const game_id = Number(document.getElementById('gameId').value);
      const author = document.getElementById('author').value.trim();
      const text = document.getElementById('text').value.trim();
      if (!game_id || !author || !text) return setStatus('Remplis Game ID, pseudo et commentaire.');

      const { error } = await supabase.from('comments').insert([{
        game_id, author, text, hidden: false, pinned: false
      }], { returning: 'minimal' });

      if (error) return setStatus('Ajout commentaire refusé: ' + error.message);
      setStatus('Commentaire ajouté', true);
      document.getElementById('text').value = '';
      await loadAll();
    }

    async function toggleHide(id, hidden) {
      const { error } = await supabase.from('comments').update({ hidden: !hidden }).eq('id', id).select();
      if (error) return setStatus('Erreur masquage: ' + error.message);
      await loadAll();
    }

    async function togglePin(id, pinned) {
      const { error } = await supabase.from('comments').update({ pinned: !pinned }).eq('id', id).select();
      if (error) return setStatus('Erreur pin: ' + error.message);
      await loadAll();
    }

    async function deleteComment(id) {
      const { error } = await supabase.from('comments').delete().eq('id', id).select();
      if (error) return setStatus('Erreur suppression: ' + error.message);
      await loadAll();
    }

    document.getElementById('loginBtn').addEventListener('click', login);
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('refreshBtn').addEventListener('click', loadAll);
    document.getElementById('addCommentBtn').addEventListener('click', addComment);

    window.toggleHide = toggleHide;
    window.togglePin = togglePin;
    window.deleteComment = deleteComment;

    (async () => {
      await checkSession();
      await loadAll();
    })();
  </script>
</body>
</html>
